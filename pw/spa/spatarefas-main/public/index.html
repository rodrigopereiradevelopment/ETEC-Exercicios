<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>SPA ToDo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <section id="loginPanel" class="card login-card" style="display:none;">
      <h1>Login</h1>
      <input type="text" id="username" placeholder="Usuário" />
      <input type="password" id="password" placeholder="Senha" />
      <button id="btnLogin">Entrar</button>
    </section>

    <section id="appPanel" class="card" style="display:none;">
      <header class="app-header">
        <h2>Tarefas</h2>
        <button id="btnLogout">Sair</button>
      </header>
      <div class="task-form">
        <input id="newTask" placeholder="Nova tarefa" />
        <button id="btnAdd">Add</button>
      </div>
      <div class="filters">
        <button type="button" data-filter="all" onclick="filterTasks('all')">Todas</button>
        <button type="button" data-filter="pending" onclick="filterTasks('pending')">A fazer</button>
        <button type="button" data-filter="completed" onclick="filterTasks('completed')">Feitas</button>
      </div>
      <ul id="taskList"></ul>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="apps.js"></script>
</body>
</html>
